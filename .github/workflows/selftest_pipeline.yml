name: 'Selftest: pipeline'

# Run by hand after scripts/setup_course.py. Pushes a sample notebook through the real path
# (commit, pull request, grading, comment) without Google. You should see a comment with a
# full score on a pull request from student-selftest_at_example_com. Close it afterwards.
on:
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out code and all branches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Submit sample notebook
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/selftest_submission.py
