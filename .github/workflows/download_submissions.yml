name: Download Student Submissions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Course ID (optional: processes every configured course if empty)'
        required: false
        type: string
      coursework_id:
        description: 'Coursework ID (optional)'
        required: false
        type: string

permissions: {}

concurrency:
  group: download-submissions
  cancel-in-progress: false

jobs:
  download:
    if: github.event_name != 'schedule' || vars.GRADER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out code and all student branches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Write Google token
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_TOKEN" > token.json
          if ! python -m json.tool token.json > /dev/null 2>&1; then
            echo "GOOGLE_TOKEN is missing or not valid JSON. Run scripts/setup_course.py."
            exit 1
          fi

      - name: Sync submissions
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          COURSE_IDS: ${{ secrets.COURSE_IDS }}
          COURSE_ID: ${{ inputs.course_id }}
          COURSEWORK_ID: ${{ inputs.coursework_id }}
        run: python scripts/download_submissions.py
