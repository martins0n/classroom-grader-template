name: Prebuild Sandbox Dependencies

# Grading runs share a cache, so building ahead of time spares the first batch of students
# from each installing the assignment's packages. Grading still works if this never ran.
on:
  push:
    branches: [main]
    paths:
      - 'test_cases/*/requirements.txt'
      - 'sandbox/**'
      - '.github/actions/prepare-sandbox/**'
  workflow_dispatch:

permissions: {}

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      assignments: ${{ steps.list.outputs.assignments }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List assignments
        id: list
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib
          names = sorted(p.parent.name for p in pathlib.Path("test_cases").glob("*/expected_output.json"))
          print("assignments=" + json.dumps(names))
          PY

  build:
    needs: list
    if: needs.list.outputs.assignments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        assignment: ${{ fromJson(needs.list.outputs.assignments) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare sandbox
        uses: ./.github/actions/prepare-sandbox
        with:
          assignment: ${{ matrix.assignment }}
