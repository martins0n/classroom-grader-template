name: Grade Homework Submission
run-name: Grade ${{ inputs.branch }}

# Started by the download workflow through workflow_dispatch, or by hand. There is
# deliberately no push or pull_request trigger: this always runs the trusted code and test
# cases from the default branch, and takes only encrypted files from the student branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Student branch, e.g. student-name_at_example_com/assignment-homework-1'
        required: true
        type: string

permissions: {}

concurrency:
  group: grade-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate branch name
        id: info
        env:
          BRANCH: ${{ inputs.branch }}
        run: python3 scripts/parse_branch.py "$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Fetch encrypted submission
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          path: .submission
          persist-credentials: false
          sparse-checkout: submissions/${{ steps.info.outputs.student_id }}/${{ steps.info.outputs.assignment_id }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install grader dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements-grader.txt

      - name: Prepare sandbox
        uses: ./.github/actions/prepare-sandbox
        with:
          assignment: ${{ steps.info.outputs.assignment_id }}

      # The only step that sees the key. It never reaches the disk or the sandbox.
      - name: Decrypt submission
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          STUDENT_ID: ${{ steps.info.outputs.student_id }}
          ASSIGNMENT_ID: ${{ steps.info.outputs.assignment_id }}
        run: >
          python scripts/decrypt_submission.py
          --student-id "$STUDENT_ID"
          --assignment-id "$ASSIGNMENT_ID"
          --input-root .submission/submissions
          --output-dir "$RUNNER_TEMP/submission"

      - name: Run notebook in the sandbox and score it
        env:
          STUDENT_ID: ${{ steps.info.outputs.student_id }}
          ASSIGNMENT_ID: ${{ steps.info.outputs.assignment_id }}
          SANDBOX_NETWORK: ${{ vars.SANDBOX_NETWORK }}
          SANDBOX_MEMORY: ${{ vars.SANDBOX_MEMORY }}
          SANDBOX_TIMEOUT: ${{ vars.SANDBOX_TIMEOUT }}
          SANDBOX_CELL_TIMEOUT: ${{ vars.SANDBOX_CELL_TIMEOUT }}
        run: >
          python scripts/run_grader.py
          --student-id "$STUDENT_ID"
          --assignment-id "$ASSIGNMENT_ID"
          --submission-dir "$RUNNER_TEMP/submission"
          --output reports/grade_report.json

      - name: Upload grading report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grading-report-${{ steps.info.outputs.student_id }}--${{ steps.info.outputs.assignment_id }}
          path: reports/grade_report.json
          if-no-files-found: ignore

  # A separate machine: the only token able to write comments never shares
  # a runner with student code or with the encryption key.
  comment:
    needs: grade
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download grading report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: grading-report-*
          path: report
          merge-multiple: true

      - name: Post result on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/render_comment.py --branch "$BRANCH" --report report/grade_report.json --output comment.md --run-url "$RUN_URL"
          number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No pull request for this branch; nothing to comment on."
            exit 0
          fi
          gh pr comment "$number" --repo "$REPO" --body-file comment.md
